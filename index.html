<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill splitter</title>
<meta name="description" content="Split a bill by who had what, with service charge, VAT, tips and venue costs.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#101C2B">
<link rel="icon" href="./icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bill splitter">
<style>
:root {
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --navy: #101C2B;
  --gold: #E0B45A;
  --text: #1B222C;
  --muted: #5F6B7B;
  --line: #E4E8ED;
  --line-strong: #CFD5DE;
  --surface: #FFFFFF;
  --app: #F4F6F8;
  --primary: #14497A;
  --primary-dark: #0F3A62;
  --primary-tint: #E7EFF7;
  --focus: #1F5E99;
  --danger: #A31B1B;
  --danger-tint: #FBE9E9;
  --ok: #1E6B3A;
  --ok-tint: #E6F3EA;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font: 400 15px/22px var(--font);
  color: var(--text); background: var(--app);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
  background: var(--navy); color: #fff;
}
.top .name { font: 600 17px/22px Cinzel, Georgia, serif; letter-spacing: .04em; }
.top .name span { color: var(--gold); }
.top .grow { margin-left: auto; }
.top .btn { min-height: 34px; background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.top .btn:hover { background: rgba(255,255,255,.08); }
.top .btn-install { background: var(--gold); border-color: var(--gold); color: var(--navy); font-weight: 600; }

.steps {
  position: sticky; top: calc(50px + env(safe-area-inset-top)); z-index: 15;
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding: 8px 14px; background: var(--app); border-bottom: 1px solid var(--line);
}
.steps::-webkit-scrollbar { display: none; }
.step {
  flex: 1 0 auto; min-height: 36px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: 18px;
  background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer;
}
.step .n { color: var(--primary); font-weight: 600; margin-left: 4px; }
.step.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.step.on .n { color: var(--gold); }

main { max-width: 640px; margin: 0 auto; padding: 12px 14px 110px; }
body.turning main { padding-bottom: 24px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px; margin-bottom: 12px;
}
h2 { font-size: 18px; line-height: 24px; margin: 0 0 10px; }
h3 { font-size: 15px; line-height: 20px; margin: 14px 0 8px; }
.head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.head-row h2 { margin: 0; }
.head-row .grow { margin-left: auto; }
.muted { color: var(--muted); }
p { margin: 0 0 10px; }

.btn {
  min-height: 44px; padding: 0 14px;
  border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); cursor: pointer; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
}
.btn:hover:not(:disabled) { background: #EEF1F5; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-big { min-height: 54px; font-size: 17px; width: 100%; }
.btn-small { min-height: 34px; padding: 0 10px; font-size: 13px; }
.icon-btn {
  flex: 0 0 auto; width: 40px; height: 40px; border: 0; border-radius: 8px;
  background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer;
}
.icon-btn:hover { background: var(--danger-tint); color: var(--danger); }

input[type=text], input:not([type]), select {
  min-height: 44px; padding: 0 10px; width: 100%; min-width: 0;
  border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
  font-size: 16px;
}
select { padding-right: 6px; }
.money { text-align: right; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field > label, .label { font-size: 13px; line-height: 17px; font-weight: 500; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.actions > * { flex: 1 1 140px; }

.add-row { display: flex; gap: 8px; }
.add-row .money { flex: 0 0 110px; }
.list { list-style: none; margin: 10px 0 0; padding: 0; }
.list li { display: flex; gap: 6px; align-items: center; padding: 4px 0; }
.list li + li { border-top: 1px solid var(--line); }
.list .money { flex: 0 0 110px; }
.list input { border-color: transparent; background: transparent; }
.list input:hover, .list input:focus { border-color: var(--line-strong); background: var(--surface); }
.sum-row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; padding: 3px 0; }
.sum-row.total { font-weight: 600; border-top: 1px solid var(--line-strong); margin-top: 6px; padding-top: 8px; }
.sum-row .muted { font-weight: 400; }

.check { border-radius: 8px; padding: 10px 12px; margin: 0; }
.check.ok { background: var(--ok-tint); color: var(--ok); }
.check.bad { background: var(--danger-tint); color: var(--danger); }
.check.plain { background: var(--app); }

.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button {
  min-height: 42px; padding: 0 12px; border: 0; background: var(--surface); cursor: pointer; font-size: 14px;
}
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--primary); color: #fff; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }
.joined { display: flex; gap: 8px; }
.joined input { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 38px; padding: 0 12px; border-radius: 19px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 14px;
}
.chip.on { background: var(--primary-tint); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.chip.all { border-style: dashed; }

.switch { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 8px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--primary); }

.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.charge-title { font-weight: 600; font-size: 16px; }
.live { margin: 4px 0 0; font-weight: 500; }
.live.bad { color: var(--danger); }

.claim-item { padding: 10px 0; }
.claim-item + .claim-item { border-top: 1px solid var(--line); }
.claim-item .sum-row { font-weight: 600; }
.status-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
.status-list .btn { flex-direction: column; min-height: 58px; gap: 0; align-items: flex-start; padding: 6px 12px; }
.status-list .btn small { color: var(--muted); font-weight: 400; }
.status-list .btn.done { border-color: var(--ok); }
.status-list .btn.done small { color: var(--ok); }

.handoff { text-align: center; padding: 40px 10px; }
.handoff p { font-size: 17px; color: var(--muted); margin-bottom: 4px; }
.handoff h2 { font-size: 34px; line-height: 42px; margin-bottom: 28px; }
.handoff .btn + .btn { margin-top: 10px; }

.turn-head h2 { font-size: 22px; line-height: 28px; margin-bottom: 2px; }
.pick-list { list-style: none; padding: 0; margin: 12px 0 0; }
.pick {
  width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 2px 10px; align-items: center;
  text-align: left; padding: 12px; margin-bottom: 8px; min-height: 60px;
  border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); cursor: pointer;
}
.pick .box {
  grid-row: span 2; width: 26px; height: 26px; border: 2px solid var(--line-strong); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;
}
.pick.on { border-color: var(--primary); background: var(--primary-tint); }
.pick.on .box { background: var(--primary); border-color: var(--primary); }
.pick.on .box::after { content: "✓"; }
.pick-name { font-weight: 600; font-size: 16px; }
.pick-price { font-variant-numeric: tabular-nums; font-weight: 600; }
.pick-with { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
.turn-foot {
  position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: var(--app);
}
.turn-foot .grow { margin-left: auto; }
.turn-foot .mine { font-variant-numeric: tabular-nums; }

.adjust-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; align-items: end; padding: 10px 0; }
.adjust-row + .adjust-row { border-top: 1px solid var(--line); }
.adjust-row .who { font-weight: 600; grid-column: 1 / 3; }
.adjust-row .field { margin: 0; }
.result { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--surface); }
.result-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.result-top .who { font-weight: 600; font-size: 16px; }
.result-top .amount { font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.result .notes { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.result details { margin-top: 6px; font-size: 14px; }
.result summary { cursor: pointer; color: var(--primary); font-weight: 500; min-height: 32px; display: flex; align-items: center; }
.result .sum-row { font-size: 14px; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--line-strong);
}
.bar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
.bar-in .grow { flex: 1; }
body.turning .bar, body.turning .steps { display: none; }

/* Photo reader sheet */
.sheet {
  position: fixed; inset: 0; z-index: 40; background: rgba(16,28,43,.55);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet-in {
  width: 100%; max-width: 640px; max-height: 94vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--surface); border-radius: 14px 14px 0 0; padding: 14px 14px 0;
}
.sheet-foot {
  position: sticky; bottom: 0; display: flex; gap: 8px; background: var(--surface);
  padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 12px;
}
.sheet-foot .grow { flex: 1; }
.scan-photo { display: block; width: 100%; max-height: 38vh; object-fit: contain; background: var(--app); border-radius: 8px; cursor: zoom-in; }
.scan-photo.big { max-height: none; cursor: zoom-out; }
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 12px 0 6px; }
.progress > div { height: 100%; width: 0; background: var(--primary); transition: width .2s; }
.scan-row { display: grid; grid-template-columns: 28px 1fr 104px; gap: 6px; align-items: center; padding: 3px 0; }
.scan-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--primary); }
.scan-row .in-prices { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-height: 32px; }
.scan-row .in-prices input { width: 18px; height: 18px; accent-color: var(--primary); }
.scan-row.off input[type=text] { opacity: .45; }
pre.raw { white-space: pre-wrap; font-size: 12px; line-height: 16px; background: var(--app); padding: 8px; border-radius: 6px; max-height: 240px; overflow: auto; }
details.rawbox summary { cursor: pointer; color: var(--primary); min-height: 36px; display: flex; align-items: center; }


.sum-row.subtotal { font-weight: 600; border-top: 1px solid var(--line-strong); margin-top: 4px; padding: 10px 0 2px; }
.presets { margin-bottom: 8px; }
.charge-row { border-top: 1px solid var(--line); padding: 8px 0 4px; }
.charge-line {
  display: grid; grid-template-columns: 96px auto minmax(0, 1fr) 40px; gap: 6px; align-items: center;
  grid-template-areas: "name name name del" "val unit amt amt";
}
.charge-line > input:not(.money) { grid-area: name; font-weight: 600; }
.charge-line > input.money { grid-area: val; }
.charge-line > .seg { grid-area: unit; }
.charge-line > .charge-amt { grid-area: amt; text-align: right; font-size: 16px; }
.charge-line > .icon-btn { grid-area: del; }
.charge-line .seg button { min-height: 44px; padding: 0 12px; }
.charge-sum {
  width: 100%; display: flex; justify-content: space-between; gap: 10px; align-items: center;
  min-height: 36px; margin-top: 4px; padding: 0 2px; border: 0; background: none; cursor: pointer;
  text-align: left; font-size: 13px; color: var(--muted);
}
.charge-sum.bad { color: var(--danger); }
.charge-sum .more { color: var(--primary); font-weight: 600; flex: 0 0 auto; }
.charge-opts { background: var(--app); border-radius: 8px; padding: 10px; margin: 4px 0 6px; }
.charge-opts .field { margin-bottom: 10px; }
.charge-opts .switch { margin-bottom: 4px; }
.total-card .sum-row { font-size: 15px; }
.total-card .sum-row.total { font-size: 20px; line-height: 28px; }
.banner { background: #FBF3E2; border-color: var(--gold); }
.banner p { margin: 0 0 6px; }
.banner p:last-child { margin: 0; }
.banner .bad { color: var(--danger); }
.result-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.result-controls .field { margin: 0; }
.result.giving { border-color: var(--gold); box-shadow: inset 5px 0 0 var(--gold); background: #FFFCF5; }
.result.getting { box-shadow: inset 5px 0 0 var(--ok); }
.result.covered .amount { color: var(--muted); }
.tag { display: inline-block; border-radius: 12px; padding: 1px 9px; font-weight: 600; font-size: 13px; margin: 2px 0; }
.tag.give { background: var(--gold); color: var(--navy); }
.tag.get { background: var(--ok-tint); color: var(--ok); }
.result .notes { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

@media (max-width: 380px) {
  .add-row .money, .list .money { flex-basis: 92px; }
  .charge-line { grid-template-columns: 84px auto minmax(0, 1fr) 36px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="name">Bill <span>splitter</span></div>
  <div class="grow"></div>
  <button class="btn btn-small btn-install" id="install" hidden>Install</button>
  <button class="btn btn-small" id="new-bill">New bill</button>
</header>
<nav class="steps" id="steps" aria-label="Steps"></nav>
<main id="view"></main>
<div class="bar"><div class="bar-in" id="bar"></div></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheet-in" role="dialog" aria-modal="true" aria-label="Photo of the bill"></div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
